<button type="button" class="ui-card group w-full p-5 text-left transition-colors hover:border-brand-300 hover:bg-slate-50 disabled:cursor-default"
  [disabled]="booked() || trip().listStatus !== 'OPEN'" (click)="selected.emit()">
  <div class="mb-5 flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-semibold text-slate-500">{{ trip().referenceDate | dateLabel:true }}</p>
      <h2 class="font-display mt-1 text-lg font-extrabold text-navy-900">{{ trip().destination.name }}</h2>
      <p class="mt-1 text-xs text-slate-500">Bookings close at {{ trip().closingTime | timeLabel }}</p>
    </div>
    @if (booked()) {
      <app-status-chip status="SCHEDULED" label="Booked" />
    } @else {
      <app-status-chip [status]="trip().listStatus" />
    }
  </div>

  <app-route-timeline [origin]="origin()" [destination]="trip().destination.name"
    [departureTime]="trip().departureTime" [arrivalTime]="trip().arrivalTime"
    [returnDepartureTime]="trip().returnDepartureTime" [returnArrivalTime]="trip().returnArrivalTime"
    [compact]="true" />

  <div class="mt-5 flex items-center justify-between border-t border-slate-100 pt-4">
    <span class="text-sm font-bold" [class.text-brand-700]="!booked()" [class.text-slate-400]="booked()">
      {{ booked() ? 'Already booked' : 'View trip' }}
    </span>
    <app-icon iconName="arrow_forward" class="text-brand-700 transition-transform group-hover:translate-x-1" />
  </div>
</button>
