@if (totalPages() > 0) {
<div class="flex justify-between items-center mt-4 gap-4 flex-wrap">
    <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 text-sm text-gray-500">
            <label for="pageSize" class="whitespace-nowrap">Items per page:</label>
            <select id="pageSize" class="rounded-md border-0 px-2 py-1 text-sm text-gray-900 ring-1 cursor-pointer"
                [value]="pageSize()" (change)="onPageSizeChange($event)">
                @for (option of pageSizeOptions(); track option) {
                <option [value]="option">{{ option }}</option>
                }
            </select>
        </div>
    </div>

    <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
        <button type="button"
            class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white"
            [disabled]="isFirstPage()" (click)="goToPage(page() - 1)">
            Previous
        </button>

        @if (visiblePages()[0] > 0) {
        <button type="button"
            class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 cursor-pointer"
            (click)="goToPage(0)">
            1
        </button>
        @if (visiblePages()[0] > 1) {
        <span
            class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700">...</span>
        }
        }

        @for (p of visiblePages(); track p) {
        <button type="button"
            class="relative inline-flex items-center px-4 py-2 border text-sm font-medium cursor-pointer" [ngClass]="p === page()
            ? 'z-10 bg-indigo-50 border-indigo-500 text-indigo-600'
            : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'" (click)="goToPage(p)">
            {{ p + 1 }}
        </button>
        }

        @if (visiblePages()[visiblePages().length - 1] < totalPages() - 1) { @if (visiblePages()[visiblePages().length -
            1] < totalPages() - 2) { <span
            class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700">
            ...</span>
            }
            <button type="button"
                class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 cursor-pointer"
                (click)="goToPage(totalPages() - 1)">
                {{ totalPages() }}
            </button>
            }

            <button type="button"
                class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white cursor-pointer"
                [disabled]="isLastPage()" (click)="goToPage(page() + 1)">
                Next
            </button>
    </nav>
</div>
}
