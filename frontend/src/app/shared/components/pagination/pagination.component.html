@if (totalPages() > 0) {
<div class="mt-5 flex flex-wrap items-center justify-between gap-4 border-t border-slate-200 pt-4">
    <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 text-sm text-slate-500">
            <label for="pageSize" class="whitespace-nowrap">{{ copy.pagination.itemsPerPage }}</label>
            <select id="pageSize" class="ui-field min-h-9 w-auto cursor-pointer px-2 py-1 text-sm"
                [value]="pageSize()" (change)="onPageSizeChange($event)">
                @for (option of pageSizeOptions(); track option) {
                <option [value]="option">{{ option }}</option>
                }
            </select>
        </div>
    </div>

    <nav class="relative z-0 inline-flex gap-1" [attr.aria-label]="copy.pagination.label">
        <button type="button"
            class="ui-button ui-button-secondary min-h-9 px-3 py-1.5"
            [disabled]="isFirstPage()" (click)="goToPage(page() - 1)">
            {{ copy.pagination.previous }}
        </button>

        @if (visiblePages()[0] > 0) {
        <button type="button"
            class="grid min-h-9 min-w-9 place-items-center rounded-lg border border-slate-200 bg-white px-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"
            (click)="goToPage(0)">
            1
        </button>
        @if (visiblePages()[0] > 1) {
        <span
            class="grid min-h-9 min-w-9 place-items-center px-2 text-sm font-semibold text-slate-500">...</span>
        }
        }

        @for (p of visiblePages(); track p) {
        <button type="button"
            class="grid min-h-9 min-w-9 place-items-center rounded-lg border px-2 text-sm font-bold" [ngClass]="p === page()
            ? 'border-brand-500 bg-brand-50 text-brand-700'
            : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'" (click)="goToPage(p)" [attr.aria-current]="p === page() ? 'page' : null">
            {{ p + 1 }}
        </button>
        }

        @if (visiblePages()[visiblePages().length - 1] < totalPages() - 1) { @if (visiblePages()[visiblePages().length -
            1] < totalPages() - 2) { <span
            class="grid min-h-9 min-w-9 place-items-center px-2 text-sm font-semibold text-slate-500">
            ...</span>
            }
            <button type="button"
                class="grid min-h-9 min-w-9 place-items-center rounded-lg border border-slate-200 bg-white px-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"
                (click)="goToPage(totalPages() - 1)">
                {{ totalPages() }}
            </button>
            }

            <button type="button"
                class="ui-button ui-button-secondary min-h-9 px-3 py-1.5"
                [disabled]="isLastPage()" (click)="goToPage(page() + 1)">
                {{ copy.pagination.next }}
            </button>
    </nav>
</div>
}
