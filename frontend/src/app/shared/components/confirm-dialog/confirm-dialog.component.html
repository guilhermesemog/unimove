@if (open()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <button type="button" class="fixed inset-0 bg-navy-950/55 backdrop-blur-[2px] transition-opacity"
        tabindex="-1"
        [attr.aria-label]="hideCancel() ? copy.actions.close : copy.actions.cancel"
        (click)="hideCancel() ? onConfirm() : onCancel()"></button>

    <div class="relative w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl" role="alertdialog" aria-modal="true"
        aria-labelledby="confirm-dialog-title" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
        <span class="mb-4 grid size-11 place-items-center rounded-xl"
            [ngClass]="variant() === 'danger' ? 'bg-red-50 text-red-600' : 'bg-brand-50 text-brand-700'">
            <app-icon [iconName]="variant() === 'danger' ? 'warning_amber' : 'help_outline'" size="lg" />
        </span>
        <h3 id="confirm-dialog-title" class="font-display text-lg font-bold text-navy-900">
            {{ title() }}
        </h3>
        <p class="mt-2 text-sm leading-6 text-slate-500">
            {{ message() }}
        </p>

        <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            @if (!hideCancel()) {
            <button type="button"
                class="ui-button ui-button-secondary"
                (click)="onCancel()">
                {{ cancelLabel() }}
            </button>
            }
            <button type="button"
                class="ui-button text-white" [ngClass]="variant() === 'danger'
          ? 'bg-red-600 hover:bg-red-700'
          : 'bg-brand-600 hover:bg-brand-700'" (click)="onConfirm()">
                {{ confirmLabel() }}
            </button>
        </div>
    </div>
</div>
}
