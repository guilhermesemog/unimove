@if (open()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-gray-900/50 transition-opacity" (click)="onCancel()"></div>

    <div class="relative bg-white rounded-lg shadow-xl max-w-sm w-full p-6" role="alertdialog" aria-modal="true"
        aria-labelledby="confirm-dialog-title">
        <h3 id="confirm-dialog-title" class="text-lg font-semibold text-gray-900">
            {{ title() }}
        </h3>
        <p class="mt-2 text-sm text-gray-500">
            {{ message() }}
        </p>

        <div class="mt-6 flex justify-end gap-3">
            <button type="button"
                class="rounded-md px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 hover:bg-gray-50 transition-colors cursor-pointer"
                (click)="onCancel()">
                {{ cancelLabel() }}
            </button>
            <button type="button"
                class="rounded-md px-4 py-2 text-sm font-medium text-white transition-colors cursor-pointer" [ngClass]="variant() === 'danger'
          ? 'bg-red-600 hover:bg-red-500'
          : 'bg-indigo-600 hover:bg-indigo-500'" (click)="onConfirm()">
                {{ confirmLabel() }}
            </button>
        </div>
    </div>
</div>
}
