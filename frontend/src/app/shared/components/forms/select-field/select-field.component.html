<div class="mb-5 flex flex-col gap-1.5">
  <label [for]="id() ?? label()" class="text-sm font-semibold text-navy-900">
    {{ label() }}
    @if (required()) {
    <span class="text-red-600" aria-hidden="true">*</span>
    }
  </label>

  <select
    class="ui-field cursor-pointer"
    [id]="id() ?? label()"
    [disabled]="disabled()"
    (change)="onChange($event)"
    (blur)="touched.set(true)"
  >
    @if (placeholder()) {
    <option [value]="-1" disabled [selected]="indexOfValue() === -1">
      {{ placeholder() }}
    </option>
    }

    @for (option of options(); track $index) {
    <option [value]="$index" [selected]="$index === indexOfValue()">{{ option.label }}</option>
    }
  </select>

  @if (touched() && errors().length > 0) {
  <app-field-errors [errors]="errors()" />
  }
</div>
