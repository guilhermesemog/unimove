<div class="flex flex-col gap-1 mb-4">
  <label [for]="id() ?? label()">
    {{ label() }}
    @if (required()) {
    <span class="text-red-500">*</span>
    }
  </label>

  <select
    class="border rounded p-2 bg-white disabled:bg-gray-100 disabled:cursor-not-allowed"
    [id]="id() ?? label()"
    [disabled]="disabled()"
    (change)="onChange($event)"
    (blur)="touched.set(true)"
  >
    @if (placeholder()) {
    <option [value]="-1" disabled [selected]="indexOfValue() === -1">
      {{ placeholder() }}
    </option>
    }

    @for (option of options(); track $index) {
    <option [value]="$index" [selected]="$index === indexOfValue()">{{ option.label }}</option>
    }
  </select>

  @if (touched() && errors().length > 0) {
  @for (error of errors(); track $index) {
  <small class="text-red-500">{{ error.message }}</small>
  }
  }
</div>
