<div class="mb-5 flex flex-col gap-1.5">
  <label [for]="id() ?? label()" class="text-sm font-semibold text-navy-900">
    {{ label() }}
    @if (required()) {
    <span class="text-red-600" aria-hidden="true">*</span>
    }
  </label>

  <div class="relative">
    <input class="ui-field"
      [class.pr-10]="type() === 'password'" [class.border-red-400]="hasError()" [class.focus:ring-red-400]="hasError()"
      [class.ui-field-error]="hasError()" [id]="id() ?? label()"
      [attr.aria-invalid]="hasError()" [attr.aria-required]="required()"
      [type]="resolvedType()" [placeholder]="placeholder()" [disabled]="disabled()" [value]="value()"
      (input)="value.set($any($event.target).value)" (blur)="touched.set(true)" />

    @if (type() === 'password') {
    <button type="button" tabindex="-1"
      class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-700"
      (click)="toggleShowPassword()">
      @if (showPassword()) {
      <app-icon iconName="visibility_off" />
      } @else {
      <app-icon iconName="visibility" />
      }
    </button>
    }
  </div>

  @if (hasError()) {
  <app-field-errors [errors]="errors()" />
  }
</div>
