<div class="mb-5 flex flex-col gap-1.5">
    <label [for]="id() ?? label()" class="text-sm font-semibold text-navy-900">
        {{ label() }}
        @if (required()) {
        <span class="text-red-600" aria-hidden="true">*</span>
        }
    </label>

    <input type="time" class="ui-field" [id]="id() ?? label()" [disabled]="disabled()" [min]="min()"
        [max]="max()" [value]="value()" (input)="onInput($event)" (blur)="touched.set(true)" />

    @if (touched() && errors().length > 0) {
    <app-field-errors [errors]="errors()" />
    }
</div>
