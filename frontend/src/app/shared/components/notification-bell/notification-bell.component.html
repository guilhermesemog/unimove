<a routerLink="/notifications" class="ui-icon-button relative" aria-label="Notifications">
  <app-icon iconName="notifications" />
  @if (notifications.unreadCount() > 0) {
  <span class="absolute -right-1 -top-1 grid min-h-5 min-w-5 place-items-center rounded-full bg-red-600 px-1 text-[0.625rem] font-extrabold leading-none text-white"
    aria-label="Unread notifications">
    {{ notifications.unreadCount() > 99 ? '99+' : notifications.unreadCount() }}
  </span>
  }
</a>
