<div class="mb-6 flex flex-col gap-4 border-b border-slate-200 pb-5 sm:flex-row sm:items-center sm:justify-between">
    <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Role</p>
        <p class="mt-1 font-semibold text-navy-900">{{ roleLabel() }}</p>
    </div>

    <div class="flex items-center justify-between gap-4 sm:justify-end">
        <div>
            <p class="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-500">Access</p>
            <app-status-chip [status]="active() ? 'ACTIVE' : 'INACTIVE'" />
        </div>
        <button type="button" class="ui-button ui-button-secondary" (click)="statusChange.emit()">
            {{ active() ? 'Deactivate' : 'Activate' }}
        </button>
    </div>
</div>
