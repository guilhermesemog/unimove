<div class="flex w-full max-w-xl items-center gap-2">
    <div class="relative min-w-0 flex-1">
    <app-icon class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" iconName="search" />
    <input type="text" [placeholder]="placeholder()"
        class="ui-field pl-10! pr-10! text-sm"
        [attr.aria-label]="placeholder()"
        [ngModel]="value()" (ngModelChange)="onInput($event)" (keyup.enter)="search.emit()" />

    @if (value()) {
    <button type="button" class="absolute right-1 top-1/2 grid size-9 -translate-y-1/2 place-items-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-700"
        [attr.aria-label]="copy.actions.clear"
        (click)="clear.emit()">
        <app-icon iconName="close" size="sm" />
    </button>
    }
    </div>
    <button type="button" class="ui-button ui-button-secondary shrink-0" (click)="search.emit()">
        {{ copy.actions.search }}
    </button>
</div>
