<nav class="fixed inset-x-3 bottom-3 z-20 mx-auto flex max-w-xl items-stretch rounded-2xl border border-slate-200/90 bg-white/95 p-1.5 shadow-[0_16px_40px_rgba(16,42,67,0.16)] backdrop-blur-lg"
    style="margin-bottom: env(safe-area-inset-bottom);" aria-label="Primary navigation">

    <a routerLink="/" routerLinkActive="bg-brand-50 text-brand-700" [routerLinkActiveOptions]="{ exact: true }"
        class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl px-1 text-slate-400 transition-colors active:bg-slate-50">
        <app-icon [iconName]="isConductor() ? 'today' : 'home'" size="lg" />
        <span class="text-[0.6875rem] font-bold">{{ isConductor() ? copy.navigation.driver.today : copy.navigation.student.home }}</span>
    </a>

    @if (isStudent()) {
    <a routerLink="/interest-lists" routerLinkActive="bg-brand-50 text-brand-700"
        class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl px-1 text-slate-400 transition-colors active:bg-slate-50">
        <app-icon iconName="add_road" size="lg" />
        <span class="text-[0.6875rem] font-bold">{{ copy.navigation.student.bookTrip }}</span>
    </a>

    <a routerLink="/bookings" routerLinkActive="bg-brand-50 text-brand-700"
        class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl px-1 text-slate-400 transition-colors active:bg-slate-50">
        <app-icon iconName="confirmation_number" size="lg" />
        <span class="text-[0.6875rem] font-bold">{{ copy.navigation.student.myTrips }}</span>
    </a>
    }

    @if (isConductor()) {
    <a routerLink="/trips" routerLinkActive="bg-brand-50 text-brand-700"
        class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl px-1 text-slate-400 transition-colors active:bg-slate-50">
        <app-icon iconName="calendar_month" size="lg" />
        <span class="text-[0.6875rem] font-bold">{{ copy.navigation.driver.schedule }}</span>
    </a>
    }

    <a routerLink="/user" routerLinkActive="bg-brand-50 text-brand-700"
        class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl px-1 text-slate-400 transition-colors active:bg-slate-50">
        <app-icon iconName="person" size="lg" />
        <span class="text-[0.6875rem] font-bold">{{ copy.navigation.student.profile }}</span>
    </a>

</nav>
