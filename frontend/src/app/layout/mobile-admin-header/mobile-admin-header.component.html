<header
    class="lg:hidden h-14 flex items-center justify-between px-4 bg-white border-b border-gray-200 sticky top-0 z-20"
    style="padding-top: env(safe-area-inset-top);">

    <button type="button" (click)="menuToggle.emit()" aria-label="Abrir menu"
        class="p-2 -ml-2 text-gray-600 cursor-pointer">
        <span class="material-icons">
            menu
        </span>
    </button>

    <h1 class="text-lg font-semibold text-gray-800">UNIMOVE</h1>

    <button type="button" (click)="logout()" aria-label="Sair" class="p-2 -mr-2 text-gray-500 cursor-pointer">
        <span class="material-icons">
            logout
        </span>
    </button>
</header>
