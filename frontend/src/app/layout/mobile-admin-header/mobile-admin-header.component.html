<header class="sticky top-0 z-20 border-b border-slate-200/80 bg-white/95 px-4 backdrop-blur-lg lg:hidden"
    style="padding-top: env(safe-area-inset-top);">
    <div class="flex h-16 items-center justify-between">

        <button type="button" (click)="menuToggle.emit()" [attr.aria-label]="copy.navigation.openMenu"
            class="ui-icon-button -ml-2">
            <app-icon iconName="menu" size="lg" />
        </button>

        <app-brand />

        <button type="button" (click)="logout()" [attr.aria-label]="copy.actions.signOut"
            class="ui-icon-button -mr-2 cursor-pointer">
            <app-icon iconName="logout" />
        </button>
    </div>
</header>
