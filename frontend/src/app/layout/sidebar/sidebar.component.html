<aside class="w-64 h-screen bg-white border-r border-gray-200 flex flex-col">
    <div class="h-16 flex items-center px-6 border-b border-gray-200">
        <h1 class="text-xl font-semibold text-gray-800">UNIMOVE</h1>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-2">

        @if (isAdmin) {

        <a routerLink="/admin" routerLinkActive="bg-gray-100 text-gray-900"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900 transition-colors">
            Home
        </a>

        } @else {

        <a routerLink="/" routerLinkActive="bg-gray-100 text-gray-900"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900 transition-colors">
            Home
        </a>

        }

    </nav>

    <div class="p-4 border-t border-gray-200">
        <button (click)="logout()"
            class="w-full flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-red-50 hover:text-red-600 transition-colors cursor-pointer">
            Logout
        </button>
    </div>
</aside>
