@if (isOpen) {
<div class="fixed inset-0 bg-black/40 z-30 lg:hidden" (click)="closeDrawer.emit()"></div>
}

<aside [class]="asideClasses">
    <div class="h-16 flex items-center px-6 border-b border-gray-200">
        <h1 class="text-xl font-semibold text-gray-800">UNIMOVE</h1>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">

        <a routerLink="/admin" routerLinkActive="bg-gray-100 text-gray-900" [routerLinkActiveOptions]="{ exact: true }"
            (click)="onLinkClick()"
            class="flex items-center gap-1 px-4 py-4 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900">
            <span class="material-icons">
                home
            </span>
            <p class="text-sm">Home</p>
        </a>

        <a routerLink="/admin/users" routerLinkActive="bg-gray-100 text-gray-900" (click)="onLinkClick()"
            class="flex items-center gap-1 px-4 py-4 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900">
            <span class="material-icons">
                manage_accounts
            </span>
            <p class="text-sm">Users</p>
        </a>

        <a routerLink="/admin/universities" routerLinkActive="bg-gray-100 text-gray-900" (click)="onLinkClick()"
            class="flex items-center gap-1 px-4 py-4 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900">
            <span class="material-icons">
                school
            </span>
            <p class="text-sm">Universities</p>
        </a>

        <a routerLink="/admin/boarding-stops" routerLinkActive="bg-gray-100 text-gray-900" (click)="onLinkClick()"
            class="flex items-center gap-1 px-4 py-4 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900">
            <span class="material-icons">
                location_on
            </span>
            <p class="text-sm">Boarding Stops</p>
        </a>

        <a routerLink="/admin/vehicles" routerLinkActive="bg-gray-100 text-gray-900" (click)="onLinkClick()"
            class="flex items-center gap-1 px-4 py-4 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900">
            <span class="material-icons">
                local_shipping
            </span>
            <p class="text-sm">Vehicles</p>
        </a>

        <a routerLink="/admin/interest-lists" routerLinkActive="bg-gray-100 text-gray-900" (click)="onLinkClick()"
            class="flex items-center gap-1 px-4 py-4 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900">
            <span class="material-icons">
                edit_note
            </span>
            <p class="text-sm">Interest Lists</p>
        </a>

        <a routerLink="/admin/trips" routerLinkActive="bg-gray-100 text-gray-900" (click)="onLinkClick()"
            class="flex items-center gap-1 px-4 py-4 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900">
            <span class="material-icons">
                directions_car
            </span>
            <p class="text-sm">Trips</p>
        </a>

    </nav>

    <div class="p-4 border-t border-gray-200">
        <button type="button" (click)="logout()"
            class="flex items-center gap-1 px-4 py-4 text-gray-700 rounded-lg hover:bg-gray-100 hover:text-gray-900 cursor-pointer">
            <span class="material-icons">
                logout
            </span>
            Logout
        </button>
    </div>
</aside>
