<app-header title="Notifications" description="Updates, reminders, and issues that need your attention." />

@if (error() && notifications().length) {
<div class="mb-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700" role="alert">{{ error() }}</div>
}

@if (loading()) {
<div class="ui-card overflow-hidden"><app-ui-state kind="loading" /></div>
} @else if (error() && !notifications().length) {
<div class="ui-card overflow-hidden"><app-ui-state kind="error" [description]="error()!" (retry)="fetch()" /></div>
} @else if (!notifications().length) {
<div class="ui-card overflow-hidden"><app-ui-state kind="empty" title="No notifications yet"
  description="Updates about your trips and operations will appear here." /></div>
} @else {
<div class="mb-3 flex justify-end">
  <button type="button" class="ui-button ui-button-secondary" [disabled]="markingAll() || !service.unreadCount()"
    (click)="markAllRead()">{{ markingAll() ? 'Marking...' : 'Mark All as Read' }}</button>
</div>
<div class="ui-card divide-y divide-slate-100 overflow-hidden">
  @for (notification of notifications(); track notification.id) {
  <article class="flex items-start gap-2 px-4 py-4 transition-colors sm:px-5" [class.bg-brand-50]="!notification.readAt">
    <button type="button" (click)="open(notification)" class="flex min-w-0 flex-1 items-start gap-3 text-left">
      <span class="mt-1 size-2 shrink-0 rounded-full" [class.bg-brand-600]="!notification.readAt"
        [class.bg-slate-300]="notification.readAt"></span>
      <span class="min-w-0 flex-1">
        <span class="block font-bold text-navy-900">{{ notification.title }}</span>
        <span class="mt-1 block text-sm leading-6 text-slate-600">{{ notification.description }}</span>
        <span class="mt-2 block text-xs font-semibold text-slate-400">{{ notification.createdAt | date:'medium' }}</span>
      </span>
    </button>
    @if (!notification.readAt) {
    <button type="button" class="shrink-0 rounded-lg px-2 py-1 text-xs font-bold text-brand-700 hover:bg-brand-100"
      (click)="markRead(notification)">Mark as Read</button>
    }
  </article>
  }
</div>
<div class="mt-4">
  <app-pagination [page]="page()" [totalPages]="totalPages()" [pageSize]="pageSize()"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" />
</div>
}
