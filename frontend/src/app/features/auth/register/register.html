<div class="flex min-h-screen w-full items-center justify-center px-4 pb-10 pt-28 sm:px-6">
    <div class="w-full max-w-md rounded-3xl border border-white/10 bg-white p-6 shadow-2xl shadow-black/20 sm:p-9">

        <div class="mb-8">
            <p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-brand-600">Welcome back</p>
            <h1 class="font-display text-2xl font-extrabold tracking-tight text-navy-900 sm:text-3xl">Sign in to UNIMOVE
            </h1>
            <p class="mt-2 text-sm leading-6 text-slate-500">Enter your credentials to access your workspace.</p>
        </div>

        <form class="flex flex-col">
            <app-text-field [formField]="loginForm.cpf" label="CPF" placeholder="000.000.000-00" />

            <app-text-field [formField]="loginForm.password" label="Password" type="password"
                placeholder="Enter your password" />

            <app-text-field [formField]="loginForm.firstName" label="First Name" placeholder="Enter your first name" />
            <app-text-field [formField]="loginForm.lastName" label="Last Name" placeholder="Enter your last name" />
            <app-text-field [formField]="loginForm.phone" label="Phone" placeholder="Enter your phone number" />

            <button type="button" class="ui-button ui-button-primary mt-2 w-full cursor-pointer"
                [disabled]="loginForm().invalid()" (click)="onSubmit()">
                Sign Up
            </button>
        </form>

    </div>
</div>
