<div class="min-h-screen w-full flex items-center justify-center bg-gray-100 px-4 py-8">
    <div class="w-full max-w-md sm:max-w-lg bg-white rounded-2xl shadow-xl shadow-gray-200/60 p-6 sm:p-10">

        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">UNIMOVE</h1>
            <h2 class="text-sm sm:text-base text-gray-500 mt-1">Entre com suas credenciais para continuar</h2>
        </div>

        <form class="flex flex-col">
            <app-text-field [formField]="loginForm.cpf" label="CPF" placeholder="000.000.000-00" />

            <app-text-field [formField]="loginForm.password" label="Senha" type="password"
                placeholder="Digite sua senha" />

            <button type="button"
                class="mt-2 w-full bg-blue-500 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-2.5 px-4 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 cursor-pointer"
                [disabled]="loginForm().invalid()" (click)="onSubmit()">
                Entrar
            </button>
        </form>

    </div>
</div>
