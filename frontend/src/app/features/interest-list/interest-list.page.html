<app-header [title]="copy.title" [description]="copy.description" />

@if (loading()) {
  <div class="ui-card overflow-hidden"><app-ui-state kind="loading" /></div>
} @else if (error()) {
  <div class="ui-card overflow-hidden"><app-ui-state kind="error" [description]="error()!" (retry)="fetch()" /></div>
} @else {
  <section aria-labelledby="date-filter-title">
    <h2 id="date-filter-title" class="font-display text-lg font-extrabold text-navy-900">{{ copy.question }}</h2>
    @if (universityOptions().length > 1) {
      <label for="university-filter" class="mt-4 block text-sm font-bold text-navy-900">University</label>
      <select id="university-filter" class="ui-field mt-2" [value]="selectedUniversityId()" (change)="selectUniversity($event)">
        <option value="all">All universities</option>
        @for (university of universityOptions(); track university.id) {
          <option [value]="university.id">{{ university.name }}</option>
        }
      </select>
    }
    <div class="-mx-4 mt-4 flex gap-2 overflow-x-auto px-4 pb-3 sm:mx-0 sm:px-0" role="group" aria-label="Filter trips by date">
      <button type="button" class="min-h-11 shrink-0 rounded-xl border px-4 text-sm font-bold transition-colors"
        [class.border-brand-500]="selectedDate() === 'all'" [class.bg-brand-50]="selectedDate() === 'all'"
        [class.text-brand-700]="selectedDate() === 'all'" [class.border-slate-200]="selectedDate() !== 'all'"
        [class.bg-white]="selectedDate() !== 'all'" [class.text-slate-600]="selectedDate() !== 'all'"
        (click)="selectedDate.set('all')">All Dates</button>
      @for (date of dateOptions(); track date) {
        <button type="button" class="min-h-11 shrink-0 rounded-xl border px-4 text-sm font-bold transition-colors"
          [class.border-brand-500]="selectedDate() === date" [class.bg-brand-50]="selectedDate() === date"
          [class.text-brand-700]="selectedDate() === date" [class.border-slate-200]="selectedDate() !== date"
          [class.bg-white]="selectedDate() !== date" [class.text-slate-600]="selectedDate() !== date"
          (click)="selectedDate.set(date)">{{ dateLabel(date) }}</button>
      }
    </div>
  </section>

  @if (availableTrips().length) {
    <div class="mt-5 grid gap-4">
      @for (trip of availableTrips(); track trip.id) {
        <app-available-trip-card [trip]="trip" [origin]="origin()" [booked]="bookedIds().has(trip.id)"
          (selected)="openTrip(trip)" />
      }
    </div>
  } @else {
    <div class="ui-card mt-5 overflow-hidden">
      <app-ui-state [title]="copy.empty" [description]="copy.emptyDescription" />
    </div>
  }
}
