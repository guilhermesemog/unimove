<app-header [title]="copy.title" [description]="copy.description" />

@if (feedback()) {
  <div class="ui-card mb-4 flex items-center justify-between gap-3 px-4 py-3 text-sm" role="status">
    <span class="flex items-center gap-2 text-navy-900"><span class="size-2 rounded-full bg-brand-500"></span>{{ feedback() }}</span>
    <button type="button" class="text-xs font-bold text-slate-500 hover:text-navy-900" (click)="feedback.set(null)">Dismiss</button>
  </div>
}

<div class="mb-5 flex border-b border-slate-200" role="tablist" aria-label="Trip history">
  <button type="button" role="tab" class="min-h-11 flex-1 border-b-2 text-sm font-bold transition"
    [attr.aria-selected]="activeTab() === 'upcoming'" [class.border-brand-500]="activeTab() === 'upcoming'"
    [class.border-transparent]="activeTab() !== 'upcoming'" [class.text-navy-900]="activeTab() === 'upcoming'"
    [class.text-slate-500]="activeTab() !== 'upcoming'" (click)="activeTab.set('upcoming')">
    {{ copy.upcoming }} <span class="ml-1 text-xs">{{ upcoming().length }}</span>
  </button>
  <button type="button" role="tab" class="min-h-11 flex-1 border-b-2 text-sm font-bold transition"
    [attr.aria-selected]="activeTab() === 'history'" [class.border-brand-500]="activeTab() === 'history'"
    [class.border-transparent]="activeTab() !== 'history'" [class.text-navy-900]="activeTab() === 'history'"
    [class.text-slate-500]="activeTab() !== 'history'" (click)="activeTab.set('history')">
    {{ copy.history }} <span class="ml-1 text-xs">{{ history().length }}</span>
  </button>
</div>

@if (loading()) {
  <div class="ui-card overflow-hidden"><app-ui-state kind="loading" /></div>
} @else if (error()) {
  <div class="ui-card overflow-hidden"><app-ui-state kind="error" [description]="error()!" (retry)="fetch()" /></div>
} @else if (displayedBookings().length) {
  <div class="grid gap-4">
    @for (booking of displayedBookings(); track booking.id) {
      <app-journey-card [booking]="booking" [trip]="tripFor(booking)" [canCancel]="activeTab() === 'upcoming' && canCancel(booking)"
        (cancelBooking)="bookingToCancel.set(booking)" />
    }
  </div>
} @else {
  <div class="ui-card overflow-hidden">
    <app-ui-state [title]="activeTab() === 'upcoming' ? copy.emptyUpcoming : copy.emptyHistory"
      [description]="activeTab() === 'upcoming' ? 'Book an available trip to see it here.' : 'Completed trips will appear here.'" />
  </div>
}

<app-confirm-dialog [open]="!!bookingToCancel()" title="Cancel this booking?"
  message="Your seat will be released. You can only book again while this trip remains open."
  confirmLabel="Cancel Booking" variant="danger" (confirm)="confirmCancellation()" (cancel)="bookingToCancel.set(null)" />
