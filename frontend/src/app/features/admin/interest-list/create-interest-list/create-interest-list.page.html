<app-header title="Plan Demand" description="Publish a travel date so students can book their seats." [showBack]="true" />

<form class="space-y-4" (submit)="$event.preventDefault(); onSubmit()">
  <section class="ui-card p-6" aria-labelledby="route-section-title">
    <div class="mb-5 border-b border-slate-100 pb-4">
      <h2 id="route-section-title" class="font-display text-lg font-extrabold text-navy-900">Date & Destination</h2>
      <p class="mt-1 text-sm text-slate-500">Choose where and when this demand will operate.</p>
    </div>
    <div class="grid gap-x-5 sm:grid-cols-2">
      <app-date-field [formField]="interestListForm.referenceDate" label="Travel Date" placeholder="Select the travel date" />
      <app-select-field [formField]="interestListForm.destinationId" label="University" placeholder="Select a university"
        [options]="universityOptions()" optionLabel="label" optionValue="value" />
    </div>
  </section>

  <section class="ui-card p-6" aria-labelledby="schedule-section-title">
    <div class="mb-5 border-b border-slate-100 pb-4">
      <h2 id="schedule-section-title" class="font-display text-lg font-extrabold text-navy-900">Booking Window & Schedule</h2>
      <p class="mt-1 text-sm text-slate-500">Set the booking deadline and both parts of the journey.</p>
    </div>
    <div class="grid gap-x-5 sm:grid-cols-2 xl:grid-cols-3">
      <app-time-field [formField]="interestListForm.closingTime" label="Bookings Close" placeholder="Select closing time" />
      <app-time-field [formField]="interestListForm.departureTime" label="Outbound Departure" placeholder="Select departure time" />
      <app-time-field [formField]="interestListForm.arrivalTime" label="Outbound Arrival" placeholder="Select arrival time" />
      <app-time-field [formField]="interestListForm.returnDepartureTime" label="Return Departure" placeholder="Select return time" />
      <app-time-field [formField]="interestListForm.returnArrivalTime" label="Return Arrival" placeholder="Select arrival time" />
    </div>
  </section>

  <div class="flex justify-end border-t border-slate-200 pt-4">
    <button type="submit" class="ui-button ui-button-primary" [disabled]="interestListForm().invalid() || !interestListForm().dirty()">Publish Demand</button>
  </div>
</form>
