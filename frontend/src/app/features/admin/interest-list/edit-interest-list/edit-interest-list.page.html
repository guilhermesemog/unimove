<app-header title="Edit Demand" description="Update the planning window and schedule for demand #{{ interestList()?.id }}." [showBack]="true" />

<form class="space-y-4" (submit)="$event.preventDefault(); onSubmit()">
  <section class="ui-card p-6">
    <div class="mb-5 border-b border-slate-100 pb-4"><h2 class="font-display text-lg font-extrabold text-navy-900">Date & Destination</h2><p class="mt-1 text-sm text-slate-500">Changes can affect every current booking.</p></div>
    <div class="grid gap-x-5 sm:grid-cols-2 xl:grid-cols-3">
      <app-date-field [formField]="interestListForm.referenceDate" label="Travel Date" placeholder="Select the travel date" />
      <app-select-field [formField]="interestListForm.destinationId" label="University" placeholder="Select a university" [options]="universityOptions()" optionLabel="label" optionValue="value" />
      <app-select-field [formField]="interestListForm.listStatus" label="Planning Status" placeholder="Select a status" [options]="statusOptions()" optionLabel="label" optionValue="value" />
    </div>
  </section>

  <section class="ui-card p-6">
    <div class="mb-5 border-b border-slate-100 pb-4"><h2 class="font-display text-lg font-extrabold text-navy-900">Booking Window & Schedule</h2><p class="mt-1 text-sm text-slate-500">Keep all times aligned with the published student journey.</p></div>
    <div class="grid gap-x-5 sm:grid-cols-2 xl:grid-cols-3">
      <app-time-field [formField]="interestListForm.closingTime" label="Bookings Close" placeholder="Select closing time" />
      <app-time-field [formField]="interestListForm.departureTime" label="Outbound Departure" placeholder="Select departure time" />
      <app-time-field [formField]="interestListForm.arrivalTime" label="Outbound Arrival" placeholder="Select arrival time" />
      <app-time-field [formField]="interestListForm.returnDepartureTime" label="Return Departure" placeholder="Select return time" />
      <app-time-field [formField]="interestListForm.returnArrivalTime" label="Return Arrival" placeholder="Select arrival time" />
    </div>
  </section>

  <div class="flex items-center justify-between border-t border-slate-200 pt-4">
    <button type="button" class="min-h-11 rounded-xl px-4 text-sm font-bold text-red-700 hover:bg-red-50" (click)="onDeleteClick()">Delete Demand</button>
    <button type="submit" class="ui-button ui-button-primary" [disabled]="interestListForm().invalid() || !interestListForm().dirty()">Save Changes</button>
  </div>
</form>

<app-confirm-dialog [open]="confirmDialog.state().open" [title]="confirmDialog.state().title"
    [message]="confirmDialog.state().message" [confirmLabel]="confirmDialog.state().confirmLabel"
    [variant]="confirmDialog.state().variant" (confirm)="confirmDialog.confirm()" (cancel)="confirmDialog.cancel()" />
