<app-header title="Edit Student" description="Update {{ student()?.user?.firstName || 'this student' }}'s account and travel profile." [showBack]="true" />

<form class="ui-card p-6" (submit)="$event.preventDefault(); onSubmit()">
    @if (student(); as currentStudent) {
    <app-account-summary [role]="currentStudent.user.role" [active]="currentStudent.user.active" (statusChange)="onToggleUserStatusClick()" />
    }
    <div class="mb-5">
        <h2 class="font-display text-lg font-bold text-navy-900">Student Profile</h2>
        <p class="mt-1 text-sm text-slate-600">Personal, academic, and travel information.</p>
    </div>
    <div class="grid gap-x-5 md:grid-cols-2">
        <app-text-field [formField]="studentForm.firstName" label="First Name" placeholder="Enter the first name" />
        <app-text-field [formField]="studentForm.lastName" label="Last Name" placeholder="Enter the last name" />
        <div>
            <app-text-field [formField]="studentForm.cpf" label="CPF" placeholder="Enter the CPF" />
            <p class="-mt-3 mb-4 text-xs text-slate-500">Formatted: {{ studentFormModel().cpf | cpf }}</p>
        </div>
        <div>
            <app-text-field [formField]="studentForm.phone" label="Phone" placeholder="Enter the phone number" />
            <p class="-mt-3 mb-4 text-xs text-slate-500">Formatted: {{ studentFormModel().phone | phone }}</p>
        </div>
        <app-number-field [formField]="studentForm.period" label="Period" placeholder="Enter the current period" />
        <app-text-field [formField]="studentForm.course" label="Course" placeholder="Enter the course" />
        <app-text-field [formField]="studentForm.address" label="Address" placeholder="Enter the address" />
        <app-select-field [formField]="studentForm.universityId" label="University" placeholder="Select the university" [options]="universityOptions()" />
    </div>
    <div class="mt-2 flex flex-col-reverse gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:items-center sm:justify-between">
        <button type="button" class="ui-button ui-button-secondary text-red-700 disabled:hidden" (click)="onDeleteClick()" [disabled]="student()?.user?.active">Delete Student</button>
        <button type="submit" class="ui-button ui-button-primary" [disabled]="studentForm().invalid() || !studentForm().dirty()">Save Changes</button>
    </div>
</form>

<app-confirm-dialog [open]="confirmDialog().open" [title]="confirmDialog().title" [message]="confirmDialog().message"
    [confirmLabel]="confirmDialog().confirmLabel" [variant]="confirmDialog().variant"
    (confirm)="onConfirmDialogConfirm()" (cancel)="onConfirmDialogCancel()" />
