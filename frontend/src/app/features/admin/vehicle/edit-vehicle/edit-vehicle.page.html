<p>edit-vehicle works!</p>
<div class="mb-6 gap-4 flex flex-row items-baseline justify-between">
    <app-header title="Vehicles" description="Edit the vehicle {{ vehicle()?.plate }} information below." />
    <app-back-button />
</div>

<div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm p-8">
    <form>
        <app-text-field [formField]="vehicleForm.plate" label="Plate" placeholder="Enter the vehicle plate" />
        <app-number-field [formField]="vehicleForm.capacity" label="Capacity" placeholder="Enter the vehicle capacity" />

        <div class="flex flex-row justify-between mb-4">
            <button type="button"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="vehicleForm().invalid() || !vehicleForm().dirty()" (click)="onSubmit()">
                Save Changes
            </button>
            <button type="button" class="bg-gray-500 none hover:bg-gray-700 text-white font-bold py-2 px-4 rounded cursor-pointer
        disabled:hidden" (click)="onDeleteClick()">
                Delete
            </button>
        </div>
    </form>
</div>

<app-confirm-dialog [open]="confirmDialog().open" [title]="confirmDialog().title" [message]="confirmDialog().message"
    [confirmLabel]="confirmDialog().confirmLabel" [variant]="confirmDialog().variant"
    (confirm)="onConfirmDialogConfirm()" (cancel)="onConfirmDialogCancel()" />
