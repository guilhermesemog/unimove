<app-header title="Add Boarding Stop" description="Add a pickup and drop-off location for students." [showBack]="true" />

<form class="ui-card max-w-2xl p-6" (submit)="$event.preventDefault(); onSubmit()">
    <div class="mb-6 border-b border-slate-200 pb-4">
        <h2 class="font-display text-lg font-bold text-navy-900">Stop Details</h2>
        <p class="mt-1 text-sm text-slate-600">Use a short, recognizable location name.</p>
    </div>
    <app-text-field [formField]="boardingStopForm.local" label="Location" placeholder="Enter the boarding stop location" />
    <div class="mt-2 flex justify-end border-t border-slate-200 pt-5">
        <button type="submit" class="ui-button ui-button-primary"
            [disabled]="boardingStopForm().invalid() || !boardingStopForm().dirty()">Add Boarding Stop</button>
    </div>
</form>
