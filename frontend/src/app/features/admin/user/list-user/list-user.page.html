<app-header title="Users & Access" description="Manage people, roles, and access to UNIMOVE." />

<app-admin-list-toolbar [value]="list.searchTerm()" placeholder="Search people by name"
    createLabel="Add User" (valueChange)="list.searchTerm.set($event)" (search)="list.onSearch()"
    (clear)="list.onClearSearch()" (create)="onCreate()" />

<!-- List -->
<app-data-table [columns]="columns" [data]="list.items()" [loading]="list.loading()" [error]="list.error()" (retry)="list.fetch()" [sortBy]="list.sortBy()"
    [sortDirection]="list.sortDirection()" (sortChange)="list.onSort($event)">
    <ng-template #rowActions let-user>
        @if (user.active) {
        <button type="button" class="min-h-11 px-2 font-semibold text-red-700 hover:text-red-800" (click)="onDeactivateClick(user)">
            Deactivate
        </button>
        } @else {
        <button type="button" class="min-h-11 px-2 font-semibold text-navy-700 hover:text-navy-900"
            (click)="onActivateClick(user)">
            Activate
        </button>
        <button type="button" class="min-h-11 px-2 font-semibold text-red-700 hover:text-red-800" (click)="onDeleteClick(user)">
            Delete
        </button>
        }
        <button type="button" class="min-h-11 px-2 font-semibold text-navy-700 hover:text-navy-900" (click)="onEdit(user)">
            Edit
        </button>
    </ng-template>
</app-data-table>

<app-pagination [page]="list.page()" [totalPages]="list.totalPages()" [pageSize]="list.pageSize()"
    (pageChange)="list.onPageChange($event)" (pageSizeChange)="list.onPageSizeChange($event)" />

<app-confirm-dialog [open]="confirmDialog.state().open" [title]="confirmDialog.state().title"
    [message]="confirmDialog.state().message" [confirmLabel]="confirmDialog.state().confirmLabel"
    [variant]="confirmDialog.state().variant" (confirm)="confirmDialog.confirm()" (cancel)="confirmDialog.cancel()" />
