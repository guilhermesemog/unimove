<app-header title="Edit User" description="Update {{ user()?.firstName || 'this user' }}'s account information." [showBack]="true" />

<form class="ui-card max-w-4xl p-6" (submit)="$event.preventDefault(); onSubmit()">
    @if (user(); as currentUser) {
    <app-account-summary [role]="currentUser.role" [active]="currentUser.active" (statusChange)="onToggleUserStatusClick()" />
    }
    <div class="mb-5">
        <h2 class="font-display text-lg font-bold text-navy-900">Personal Information</h2>
        <p class="mt-1 text-sm text-slate-600">Keep identity and contact details current.</p>
    </div>
    <div class="grid gap-x-5 md:grid-cols-2">
        <app-text-field [formField]="userForm.firstName" label="First Name" placeholder="Enter the first name" />
        <app-text-field [formField]="userForm.lastName" label="Last Name" placeholder="Enter the last name" />
        <div>
            <app-text-field [formField]="userForm.cpf" label="CPF" placeholder="Enter the CPF" />
            <p class="-mt-3 mb-4 text-xs text-slate-500">Formatted: {{ userFormModel().cpf | cpf }}</p>
        </div>
        <div>
            <app-text-field [formField]="userForm.phone" label="Phone" placeholder="Enter the phone number" />
            <p class="-mt-3 mb-4 text-xs text-slate-500">Formatted: {{ userFormModel().phone | phone }}</p>
        </div>
    </div>
    <div class="mt-2 flex flex-col-reverse gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:items-center sm:justify-between">
        <button type="button" class="ui-button ui-button-secondary text-red-700 disabled:hidden" (click)="onDeleteClick()" [disabled]="user()?.active">Delete User</button>
        <button type="submit" class="ui-button ui-button-primary" [disabled]="userForm().invalid() || !userForm().dirty()">Save Changes</button>
    </div>
</form>

<app-confirm-dialog [open]="confirmDialog().open" [title]="confirmDialog().title" [message]="confirmDialog().message"
    [confirmLabel]="confirmDialog().confirmLabel" [variant]="confirmDialog().variant"
    (confirm)="onConfirmDialogConfirm()" (cancel)="onConfirmDialogCancel()" />
