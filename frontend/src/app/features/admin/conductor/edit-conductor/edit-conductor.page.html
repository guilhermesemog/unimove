<app-header title="Edit Driver" description="Update {{ conductor()?.user?.firstName || 'this driver' }}'s account and license." [showBack]="true" />

<form class="ui-card p-6" (submit)="$event.preventDefault(); onSubmit()">
    @if (conductor(); as currentDriver) {
    <app-account-summary [role]="currentDriver.user.role" [active]="currentDriver.user.active" (statusChange)="onToggleUserStatusClick()" />
    }
    <div class="mb-5">
        <h2 class="font-display text-lg font-bold text-navy-900">Driver Profile</h2>
        <p class="mt-1 text-sm text-slate-600">Personal, contact, and license information.</p>
    </div>
    <div class="grid gap-x-5 md:grid-cols-2">
        <app-text-field [formField]="conductorForm.firstName" label="First Name" placeholder="Enter the first name" />
        <app-text-field [formField]="conductorForm.lastName" label="Last Name" placeholder="Enter the last name" />
        <div>
            <app-text-field [formField]="conductorForm.cpf" label="CPF" placeholder="Enter the CPF" />
            <p class="-mt-3 mb-4 text-xs text-slate-500">Formatted: {{ conductorFormModel().cpf | cpf }}</p>
        </div>
        <div>
            <app-text-field [formField]="conductorForm.phone" label="Phone" placeholder="Enter the phone number" />
            <p class="-mt-3 mb-4 text-xs text-slate-500">Formatted: {{ conductorFormModel().phone | phone }}</p>
        </div>
        <app-text-field [formField]="conductorForm.license" label="License Number" placeholder="Enter the license number" />
        <app-date-field [formField]="conductorForm.licenseExpirationDate" label="License Expiration Date" />
    </div>
    <div class="mt-2 flex flex-col-reverse gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:items-center sm:justify-between">
        <button type="button" class="ui-button ui-button-secondary text-red-700 disabled:hidden" (click)="onDeleteClick()" [disabled]="conductor()?.user?.active">Delete Driver</button>
        <button type="submit" class="ui-button ui-button-primary" [disabled]="conductorForm().invalid() || !conductorForm().dirty()">Save Changes</button>
    </div>
</form>

<app-confirm-dialog [open]="confirmDialog().open" [title]="confirmDialog().title" [message]="confirmDialog().message"
    [confirmLabel]="confirmDialog().confirmLabel" [variant]="confirmDialog().variant"
    (confirm)="onConfirmDialogConfirm()" (cancel)="onConfirmDialogCancel()" />
